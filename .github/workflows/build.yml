name: Build CSS & JS

on:
  push:
    branches: [ develop ]
    paths:
      - '**.scss'
      - '**.js'
      - 'package-lock.json'
  pull_request:
    branches: [ develop ]
    paths:
      - '**.scss'
      - '**.js'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:

  build:

    name: 'Build CSS & JS'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Copy assets
        run: npm run copy-assets

      - name: Commit assets
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Update assets

      - name: Build Bootstrap 5 CSS
        run: npm run css

      - name: Build Bootstrap 5 JS
        run: npm run js

      - name: Build Bootstrap 4 CSS
        run: npm run css-bs4

      - name: Build Bootstrap 4 JS
        run: npm run js-bs4

      - name: Commit CSS and JS files
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Rebuild CSS and JS files
