name: Lint

on:
  push:
    branches: [ develop ]
    paths:
      - '**.php'
      - 'phpcs.xml.dist'
      - 'phpmd.xml'
      - 'phpstan.neon.dist'
  pull_request:
    branches: [ develop ]
    paths:
      - '**.php'
      - 'phpcs.xml.dist'
      - 'phpmd.xml'
      - 'phpstan.neon.dist'
  workflow_dispatch:

env:
  php-version: '7.4'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:

  phpcs:

    name: 'Coding Standards with PHP CodeSniffer'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.php-version }}
          tools: cs2pr
          coverage: none
        env:
          fail-fast: true

      - name: Cache PHPCS cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .phpcs-cache.json
          key: ${{ runner.os }}-phpcs-cache-${{ hashFiles('**/composer.lock', 'phpcs.xml.dist') }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Auto fix coding standards
        if: github.event_name != 'pull_request'
        run: composer phpcs-fix
        continue-on-error: true

      - name: Commit coding standards fixes
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Fix coding standards with phpcbf

      - name: Check coding standards
        run: composer phpcs -- -q -n --report=checkstyle | cs2pr

  php-lint:

    name: 'Syntax with PHP Parallel Lint'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.php-version }}
          tools: cs2pr, parallel-lint
          coverage: none
        env:
          fail-fast: true

      - name: Check syntax
        run: parallel-lint --checkstyle . | cs2pr

  phpstan:

    name: 'Static Analysis with PHPStan'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.php-version }}
          coverage: none
        env:
          fail-fast: true

      - name: Cache PHPStan cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .phpstan-cache
          key: ${{ runner.os }}-phpstan-cache-${{ hashFiles('**/composer.lock', 'phpstan.neon.dist') }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Analyse
        id: phpstan
        run: composer phpstan -- --error-format=github

      - name: Update basefile
        if: github.event_name != 'pull_request'
        run: composer phpstan-baseline

      - name: Commit updated basefile
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Update PHPStan basefile

  phpmd:

    name: 'Mess Detection with PHPMD'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.php-version }}
          tools: phpmd
          coverage: none
        env:
          fail-fast: true

      - name: Detect mess
        run: phpmd . github phpmd.xml

      - name: Update basefile
        if: github.event_name != 'pull_request'
        run: phpmd . ansi phpmd.xml --generate-baseline

      - name: Commit updated basefile
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Update PHPMD basefile
